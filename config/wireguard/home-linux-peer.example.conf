# OPTION B: WireGuard on an always-on home Linux device (Raspberry Pi, mini PC)
# instead of on the MikroTik. Use this if the router route doesn't work out.
#
# The device dials out to the VPS and forwards ONLY the VPS's SMB traffic to
# the router's LAN address, masquerading it, so the MikroTik needs no changes
# (its SMB share just sees a normal LAN client).
#
# Install on the device (Debian/Raspberry Pi OS):
#   sudo apt install -y wireguard-tools nftables
#   wg genkey | sudo tee /etc/wireguard/air-private.key | wg pubkey   # -> send this public key to the VPS step
#   sudo chmod 600 /etc/wireguard/air-private.key
#   sudo nano /etc/wireguard/wg-air.conf        # paste this file, replace the CAPITALS
#   sudo systemctl enable --now wg-quick@wg-air
#
# On the VPS:  bash scripts/wg-setup.sh peer DEVICE_PUBLIC_KEY ROUTER_LAN_IP
# and mount   //ROUTER_LAN_IP/SHARE   (scripts/nas-setup.sh test ROUTER_LAN_IP SHARE)

[Interface]
Address = 10.77.88.2/30
MTU = 1420
PostUp = wg set %i private-key /etc/wireguard/air-private.key
# Forward only VPS -> router:445, and masquerade so the router can reply.
PostUp = sysctl -q -w net.ipv4.ip_forward=1
PostUp = nft -f - <<< 'table ip air { chain fwd { type filter hook forward priority 0; policy accept; iifname "%i" ip daddr != ROUTER_LAN_IP drop; iifname "%i" meta l4proto udp drop; iifname "%i" meta l4proto tcp tcp dport != 445 drop; } chain nat { type nat hook postrouting priority 100; ip saddr 10.77.88.1 ip daddr ROUTER_LAN_IP masquerade; } }'
PostDown = nft delete table ip air

[Peer]
# The VPS
PublicKey = VPS_PUBLIC_KEY
Endpoint = VPS_PUBLIC_IP:51820
AllowedIPs = 10.77.88.1/32
PersistentKeepalive = 25
